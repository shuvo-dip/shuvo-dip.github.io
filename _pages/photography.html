<style>
.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 1rem;
}

.photo-item {
  position: relative;
  cursor: pointer;
}

.photo-item img {
  width: 100%;
  height: auto;
  border-radius: 6px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.photo-item:hover img {
  transform: scale(1.02);
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}

.caption {
  font-size: 0.85em;
  margin-top: 0.25em;
  color: #555;
}

/* Lightbox overlay */
#lightbox-overlay {
  display: none;
  position: fixed;
  z-index: 9999;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background-color: rgba(0,0,0,0.88);
  justify-content: center;
  align-items: center;
}

.lb-content {
  max-width: 90vw;
  max-height: 90vh;
  text-align: center;
  color: #fff;
}

.lb-img {
  max-width: 100%;
  max-height: 75vh;
  border-radius: 8px;
  margin-bottom: 0.5rem;
}

.lb-meta {
  font-size: 0.9em;
  color: #ccc;
  margin-bottom: 0.5rem;
}

/* Nav arrows */
.lb-nav {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none; /* prevents overlay from blocking click */
}

.lb-btn {
  pointer-events: auto;
  background: none; /* no circle */
  color: rgba(255, 255, 255, 0.7); /* semi-transparent white */
  border: none;
  font-size: 3rem; /* bigger arrow */
  padding: 0 1rem;
  cursor: pointer;
  transition: color 0.2s ease;
}

.lb-btn:hover {
  color: rgba(255, 255, 255, 1); /* fully white on hover */
}

</style>

<!-- Lightbox -->
<div id="lightbox-overlay">
  <div class="lb-content">
    <img id="lb-img" class="lb-img" src="" alt="">
    <div id="lb-caption"></div>
    <div id="lb-meta" class="lb-meta"></div>
    <div class="lb-nav">
      <button class="lb-btn" onclick="changeImg(-1)">❮</button>
      <button class="lb-btn" onclick="changeImg(1)">❯</button>
    </div>
  </div>
</div>

<script>
const overlay = document.getElementById('lightbox-overlay');
const lbImg = document.getElementById('lb-img');
const lbCaption = document.getElementById('lb-caption');
const lbMeta = document.getElementById('lb-meta');
const items = Array.from(document.querySelectorAll('.photo-item'));
let currentIndex = 0;

function openLightbox(index) {
  currentIndex = index;
  const item = items[currentIndex];
  lbImg.src = item.querySelector('img').src;
  lbCaption.textContent = item.dataset.caption;
  lbMeta.textContent = [
    item.dataset.date ? `Date: ${item.dataset.date}` : '',
    item.dataset.camera ? `Camera: ${item.dataset.camera}` : '',
    item.dataset.lens ? `Lens: ${item.dataset.lens}` : '',
    item.dataset.settings ? `Settings: ${item.dataset.settings}` : ''
  ].filter(Boolean).join(' • ');
  overlay.style.display = 'flex';
}

function closeLightbox() {
  overlay.style.display = 'none';
}

function changeImg(dir) {
  currentIndex = (currentIndex + dir + items.length) % items.length;
  openLightbox(currentIndex);
}

items.forEach((item, index) => {
  item.addEventListener('click', () => openLightbox(index));
});

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) closeLightbox();
});

document.addEventListener('keydown', (e) => {
  if (overlay.style.display === 'flex') {
    if (e.key === 'ArrowRight') changeImg(1);
    if (e.key === 'ArrowLeft') changeImg(-1);
    if (e.key === 'Escape') closeLightbox();
  }
});
</script>

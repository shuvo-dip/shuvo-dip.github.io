<style>
/* Full-bleed section: stretches to page edges even inside theme layout */
.full-bleed {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  margin-right: calc(50% - 50vw);
  padding: 0 1rem;
}

/* Masonry grid */
.photo-grid {
  column-count: 3;
  column-gap: 1rem;
}
@media (max-width: 1100px) { .photo-grid { column-count: 2; } }
@media (max-width: 680px)  { .photo-grid { column-count: 1; } }

.photo-item {
  display: inline-block;
  margin: 0 0 1rem;
  width: 100%;
  break-inside: avoid;
  position: relative;
  cursor: zoom-in;
}

.photo-item img {
  width: 100%;
  border-radius: 8px;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.photo-item:hover img {
  transform: scale(1.02);
  box-shadow: 0 6px 24px rgba(0,0,0,0.25);
}
.caption {
  font-size: 0.9em;
  color: #555;
  margin-top: 0.35em;
}

/* Lightbox */
#lightbox-overlay {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,0.86);
  justify-content: center;
  align-items: center;
  padding: 2vw;
}
.lb-inner {
  display: grid;
  grid-template-columns: minmax(0, 72vw);
  gap: 0.75rem;
  max-width: 92vw;
}
.lb-img {
  max-width: 100%;
  max-height: 82vh;
  border: 4px solid #fff;
  border-radius: 10px;
  box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  cursor: zoom-out;
  background: #111;
  object-fit: contain;
}
.lb-meta {
  background: #111;
  color: #eee;
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.95em;
  line-height: 1.5;
}

/* Prev/Next controls */
.lb-nav {
  position: fixed;
  top: 50%;
  left: 0;
  right: 0;
  height: 0;
  pointer-events: none;
}
.lb-btn {
  position: absolute;
  top: -1.25rem;
  transform: translateY(-50%);
  pointer-events: auto;
  background: rgba(255,255,255,0.92);
  border: none;
  border-radius: 999px;
  width: 44px; height: 44px;
  font-size: 1.25rem;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.lb-prev { left: 1.25rem; }
.lb-next { right: 1.25rem; }
.lb-btn:hover { background: #fff; }

/* Form inside lightbox */
.lb-form label { display:block; margin: .4rem 0 .2rem; color:#ddd; }
.lb-form input, .lb-form textarea {
  width: 100%;
  border: 1px solid #333;
  background: #0e0e0e;
  color: #eee;
  border-radius: 6px;
  padding: .5rem .6rem;
}
.lb-form button {
  margin-top: .6rem;
  background: #1a73e8;
  color: #fff; border: 0; border-radius: 6px;
  padding: .5rem .9rem; cursor: pointer;
}
.lb-form small { color:#999; }

/* Make heading container full-bleed too so it aligns with grid */
.page__content > h2 { margin-left: calc(50% - 50vw); padding-left: 1rem; }
</style>

<!-- Lightbox -->
<div id="lightbox-overlay" role="dialog" aria-modal="true" aria-label="Image viewer" style="display:none;">
  <div class="lb-nav">
    <button class="lb-btn lb-prev" aria-label="Previous" onclick="nav(-1)">❮</button>
    <button class="lb-btn lb-next" aria-label="Next" onclick="nav(1)">❯</button>
  </div>

  <div class="lb-inner" onclick="event.stopPropagation()">
    <img id="lb-img" class="lb-img" src="" alt="">
    <div class="lb-meta">
      <div id="lb-caption" style="margin-bottom:.35rem;font-weight:600;"></div>
      <div id="lb-tech"   style="font-size:.95em; color:#bbb;"></div>

</div>

<script>
(function(){
  const overlay = document.getElementById('lightbox-overlay');
  const lbImg    = document.getElementById('lb-img');
  const lbCaption= document.getElementById('lb-caption');
  const lbTech   = document.getElementById('lb-tech');
  const lbSlug   = document.getElementById('lb-slug');

  const items = Array.from(document.querySelectorAll('.photo-item'));
  let idx = 0;

  // Open on click
  items.forEach((item, i) => {
    item.addEventListener('click', () => open(i));
  });

  function open(i){
    idx = i;
    const it = items[idx];
    const img = it.querySelector('img');

    lbImg.src = img.src;
    lbImg.alt = img.alt || '';
    lbCaption.textContent = it.dataset.caption || img.alt || '';
    lbTech.textContent = [
      it.dataset.date ? `Updated: ${it.dataset.date}` : '',
      it.dataset.camera,
      it.dataset.lens,
      it.dataset.settings
    ].filter(Boolean).join(' • ');
    lbSlug.value = it.dataset.slug || (img.src.split('/').pop().replace(/\.[^.]+$/, ''));

    overlay.style.display = 'flex';
  }

  function close(){ overlay.style.display = 'none'; }
  function next(){ open((idx + 1) % items.length); }
  function prev(){ open((idx - 1 + items.length) % items.length); }

  // Expose for buttons
  window.nav = function(dir){ dir > 0 ? next() : prev(); };

  // Keyboard navigation
  window.addEventListener('keydown', (e) => {
    if (overlay.style.display !== 'flex') return;
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'Escape')     close();
  });

  // Click outside to close
  overlay.addEventListener('click', close);
})();
</script>

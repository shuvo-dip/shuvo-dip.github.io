<style>
.blog-switcher { text-align:center; margin-bottom: 2em; }
.blog-switcher .btn {
  display:inline-block; padding:0.5em 1em; margin:0 0.5em;
  background:#f2f2f2; color:#333; border-radius:6px; text-decoration:none;
  border:1px solid #ccc; font-weight:500;
}
.blog-switcher .btn:hover { background:#e9e9e9; }
.blog-switcher .btn.active { background:#1a73e8; color:#fff; border-color:#1a73e8; }
</style>

{% assign is_posts = page.url == '/year-archive/' or page.url == '/blog/' %}
{% assign is_photography = page.url == '/photography/' %}

<div class="blog-switcher">
  <a class="btn {% if is_posts %}active{% endif %}" href="{{ '/year-archive/' | relative_url }}">All Posts</a>
  <a class="btn {% if is_photography %}active{% endif %}" href="{{ '/photography/' | relative_url }}">Photography</a>
</div>
